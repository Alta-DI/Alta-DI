<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 旅遊管家 - iframe tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        .chat-frame-container {
            height: calc(100vh - 180px);
            min-height: 500px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-900 antialiased">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🤖</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">AI 智能行程配置系統</h1>
                    <p class="text-indigo-200 text-xs">最新參數規範測試工具</p>
                </div>
            </div>
            <div class="text-xs bg-indigo-800/50 px-3 py-1 rounded-full border border-indigo-400/30 font-mono">
                參數模式：var_hotel / var_destination / user_id ...
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left: Config Form -->
            <div class="lg:col-span-4 space-y-4">
                <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-y-auto max-h-[calc(100vh-140px)]">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-700 border-b pb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        行程數據配置
                    </h2>
                    
                    <form id="configForm" class="space-y-4 text-sm">
                        <!-- Base URL Configuration -->
                        <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
                            <label class="block text-indigo-700 font-bold mb-1 text-xs uppercase tracking-wider">助理基礎網址</label>
                            <input type="text" id="base_url" value="https://altatech.ai/widget/eezuywwgybk5ybgbmbjgeml/chat.html"
                                class="w-full px-3 py-2 bg-white border border-indigo-200 rounded-lg transition-all font-mono text-xs">
                        </div>

                        <!-- User ID (取代 Email) -->
                        <div>
                            <label class="block text-slate-500 font-medium mb-1">用戶 User ID</label>
                            <input type="text" id="user_id" value="user_123456"
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all">
                        </div>

                        <!-- var_destination -->
                        <div>
                            <label class="block text-slate-500 font-medium mb-1">目的地 (var_destination)</label>
                            <input type="text" id="var_destination" value="大阪"
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all">
                        </div>

                        <!-- Times -->
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-slate-500 font-medium mb-1 text-xs">到達時間 (arrival_time)</label>
                                <input type="datetime-local" id="var_arrival_time" value="2026-10-21T12:30"
                                    class="w-full px-2 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all text-xs">
                            </div>
                            <div>
                                <label class="block text-slate-500 font-medium mb-1 text-xs">離開時間 (departure_time)</label>
                                <input type="datetime-local" id="var_departure_time" value="2026-10-31T20:40"
                                    class="w-full px-2 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all text-xs">
                            </div>
                        </div>

                        <!-- Pax Count -->
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-slate-500 font-medium mb-1 text-xs">成人人數 (adult_num)</label>
                                <input type="number" id="var_adult_num" value="2"
                                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all">
                            </div>
                            <div>
                                <label class="block text-slate-500 font-medium mb-1 text-xs">兒童人數 (child_num)</label>
                                <input type="number" id="var_child_num" value="1"
                                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg transition-all">
                            </div>
                        </div>

                        <!-- Hotels JSON -->
                        <div class="pt-2 border-t border-slate-100">
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-indigo-700 font-bold">飯店資訊 (var_hotel)</label>
                                <span id="jsonStatus" class="text-[10px] px-2 py-0.5 rounded bg-green-100 text-green-700 font-bold uppercase">Valid JSON</span>
                            </div>
                            <textarea id="var_hotel" rows="6" 
                                class="w-full px-3 py-2 bg-slate-900 text-green-400 border border-slate-700 rounded-lg transition-all font-mono text-[11px] leading-relaxed">[
  {
    "CheckInDate": "2026-10-21",
    "CheckOutDate": "2026-10-24",
    "HotelName": "大阪難波東急STAY",
    "HotelAddress": "大阪市中央區難波3-2-1"
  }
]</textarea>
                        </div>

                        <button type="button" onclick="updateIframe()" 
                            class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-200 flex justify-center items-center gap-2 mt-2">
                            <span>🚀</span> 更新行程並啟動助理
                        </button>
                    </form>
                </section>
            </div>

            <!-- Right: Chatbot -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col chat-frame-container">
                    <!-- Status Bar -->
                    <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2">
                                <div id="statusDot" class="w-2.5 h-2.5 bg-slate-400 rounded-full"></div>
                                <span id="statusText" class="text-xs font-bold text-slate-600 uppercase tracking-widest">Assistant Idle</span>
                            </div>
                            <!-- URL Length Counter -->
                            <div id="urlCounter" class="hidden md:flex items-center gap-2 text-[10px] px-2 py-1 bg-slate-200 rounded border border-slate-300">
                                <span class="text-slate-500">網址長度:</span>
                                <span id="charCount" class="font-bold">0</span>
                                <span id="lengthLimit" class="text-slate-400">/ 2048</span>
                            </div>
                        </div>
                        <div id="urlPreview" class="hidden md:block text-[10px] text-slate-400 font-mono truncate max-w-sm">
                            等待初始化...
                        </div>
                    </div>
                    
                    <!-- Iframe Container -->
                    <div class="flex-grow relative bg-slate-100" id="chatWrapper">
                        <!-- Loading State -->
                        <div id="loading" class="absolute inset-0 flex items-center justify-center bg-white z-20 hidden">
                            <div class="flex flex-col items-center">
                                <div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                                <p class="mt-4 text-slate-500 text-sm font-medium">正在載入行程助理...</p>
                            </div>
                        </div>
                        
                        <!-- Placeholder -->
                        <div id="placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-50 text-center p-8 z-10">
                            <div class="max-w-sm">
                                <div class="text-5xl mb-4">✨</div>
                                <h3 class="text-lg font-bold text-slate-700">更新參數後啟動</h3>
                                <p class="text-slate-500 text-sm mt-2">參數已切換：將 email 替換為 user_id 進行識別。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // JSON 格式校驗
        const jsonEl = document.getElementById('var_hotel');
        const statusEl = document.getElementById('jsonStatus');
        
        jsonEl.addEventListener('input', () => {
            try {
                JSON.parse(jsonEl.value);
                statusEl.innerText = "Valid JSON";
                statusEl.className = "text-[10px] px-2 py-0.5 rounded bg-green-100 text-green-700 font-bold uppercase";
            } catch (e) {
                statusEl.innerText = "Invalid JSON";
                statusEl.className = "text-[10px] px-2 py-0.5 rounded bg-red-100 text-red-700 font-bold uppercase";
            }
        });

        function updateIframe() {
            const loading = document.getElementById('loading');
            const placeholder = document.getElementById('placeholder');
            const urlPreview = document.getElementById('urlPreview');
            const chatWrapper = document.getElementById('chatWrapper');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const charCount = document.getElementById('charCount');
            const urlCounter = document.getElementById('urlCounter');
            
            const userBaseUrl = document.getElementById('base_url').value.trim();
            if (!userBaseUrl) {
                alert("請輸入有效的基礎網址！");
                return;
            }

            loading.classList.remove('hidden');
            placeholder.classList.add('hidden');
            statusDot.classList.replace('bg-slate-400', 'bg-green-500');
            statusDot.classList.add('animate-pulse');
            statusText.innerText = "Live AI Assistant";

            let hotelData = document.getElementById('var_hotel').value;
            try {
                const jsonObj = JSON.parse(hotelData);
                hotelData = JSON.stringify(jsonObj);
            } catch (e) {
                console.warn("JSON 格式有誤");
            }

            // 更新數據對象：將 email 改為 user_id
            const formData = {
                user_id: document.getElementById('user_id').value,
                var_destination: document.getElementById('var_destination').value,
                var_arrival_time: document.getElementById('var_arrival_time').value,
                var_departure_time: document.getElementById('var_departure_time').value,
                var_adult_num: document.getElementById('var_adult_num').value,
                var_child_num: document.getElementById('var_child_num').value,
                var_hotel: hotelData 
            };
            
            const params = new URLSearchParams();
            Object.keys(formData).forEach(key => {
                if (formData[key]) {
                    params.append(key, formData[key]);
                }
            });

            const connector = userBaseUrl.includes('?') ? '&' : '?';
            const fullUrl = `${userBaseUrl}${connector}${params.toString()}`;
            
            urlCounter.classList.remove('hidden');
            const urlLength = fullUrl.length;
            charCount.innerText = urlLength;
            
            if (urlLength > 2048) {
                charCount.classList.add('text-red-600');
            } else {
                charCount.classList.remove('text-red-600');
            }

            urlPreview.innerText = fullUrl;
            urlPreview.title = fullUrl;

            const oldIframe = chatWrapper.querySelector('iframe');
            if (oldIframe) chatWrapper.removeChild(oldIframe);

            const iframe = document.createElement('iframe');
            iframe.src = fullUrl;
            iframe.className = "w-full h-full border-none relative z-10";
            iframe.allow = "microphone *; clipboard-write";
            
            iframe.onload = function() {
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 500);
            };

            chatWrapper.appendChild(iframe);
        }
    </script>
</body>
</html>
