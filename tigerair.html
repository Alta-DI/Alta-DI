
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 旅遊管家 - iframe tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f8; min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #3730a3, #4f46e5);
      color: #fff; display: flex; align-items: center;
      justify-content: space-between; padding: 12px 24px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-left h1 { font-size: 1.1rem; font-weight: 700; }
    .header-left p  { font-size: 0.7rem; opacity: .75; }
    .header-right { font-size: 0.7rem; opacity: .85; background: rgba(255,255,255,.15); padding: 4px 12px; border-radius: 20px; }

    .main {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px; padding: 20px 24px;
    }

    /* ── Left panel ── */
    .config-panel {
      background: #fff; border-radius: 14px; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 13px;
      overflow-y: auto; max-height: calc(100vh - 90px);
    }
    .panel-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 1rem; font-weight: 700; color: #3730a3;
      border-bottom: 1px solid #e5e7eb; padding-bottom: 12px;
    }

    /* ENV toggle */
    .env-toggle {
      display: flex; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden;
    }
    .env-btn {
      flex: 1; padding: 7px 0; font-size: 0.8rem; font-weight: 600;
      background: none; border: none; cursor: pointer; color: #6b7280;
      transition: background .15s, color .15s;
    }
    .env-btn.active-uat  { background: #fef3c7; color: #92400e; }
    .env-btn.active-prod { background: #dcfce7; color: #166534; }
    .env-btn:not(:last-child) { border-right: 1.5px solid #e5e7eb; }

    /* Fields */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 0.76rem; font-weight: 600; color: #374151;
      display: flex; align-items: center; gap: 5px;
    }
    .req { color: #ef4444; font-size: 0.65rem; font-weight: 700; }
    .opt { color: #9ca3af; font-size: 0.65rem; }

    input[type=text], input[type=url], input[type=number],
    input[type=datetime-local] {
      border: 1.5px solid #d1d5db; border-radius: 8px;
      padding: 8px 11px; font-size: 0.84rem; color: #111;
      width: 100%; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    .url-input { background: #eef2ff; border-color: #a5b4fc; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Section divider */
    .section-label {
      font-size: 0.7rem; font-weight: 700; color: #6366f1;
      text-transform: uppercase; letter-spacing: .06em;
      border-left: 3px solid #6366f1; padding-left: 8px;
      margin-top: 2px;
    }

    /* Return departure highlight */
    .highlight-field input {
      background: #f0fdf4; border-color: #86efac;
    }
    .highlight-field label { color: #166534; }
    .new-badge {
      background: #dcfce7; color: #166534;
      font-size: 0.6rem; font-weight: 700;
      padding: 1px 6px; border-radius: 10px;
    }

    /* JSON area */
    .json-header { display: flex; align-items: center; justify-content: space-between; }
    .json-label  { font-size: 0.76rem; font-weight: 600; color: #374151; display: flex; align-items: center; gap: 5px; }
    .json-badge  { font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .json-badge.valid   { background: #d1fae5; color: #065f46; }
    .json-badge.invalid { background: #fee2e2; color: #991b1b; }

    textarea.json-area {
      font-family: "SFMono-Regular", Consolas, monospace;
      background: #1e1e2e; color: #a6e3a1;
      border: none; border-radius: 8px;
      padding: 10px 12px; font-size: 0.76rem;
      resize: vertical; min-height: 90px; width: 100%; outline: none;
    }
    textarea.json-area:focus { outline: 2px solid #6366f1; }

    .hint { font-size: 0.68rem; color: #9ca3af; margin-top: 2px; }

    .launch-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; border: none; border-radius: 10px;
      padding: 13px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; width: 100%;
      transition: opacity .15s, transform .1s;
      margin-top: 4px;
    }
    .launch-btn:hover  { opacity: .92; transform: translateY(-1px); }
    .launch-btn:active { transform: none; }

    /* ── Right panel ── */
    .chat-panel {
      background: #fff; border-radius: 14px;
      display: flex; flex-direction: column;
      overflow: hidden; max-height: calc(100vh - 90px);
    }
    .chat-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; border-bottom: 1px solid #f0f2f8;
      font-size: 0.76rem; color: #6b7280; flex-shrink: 0;
    }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      font-weight: 700; font-size: 0.72rem; color: #374151;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
    .dot.live { background: #22c55e; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
    .url-counter { background: #f3f4f6; border-radius: 6px; padding: 3px 10px; }
    .url-warn { color: #f59e0b; font-weight: 700; }

    .chat-placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #9ca3af; background: #fafafa;
    }
    .chat-placeholder .sparkle { font-size: 2.2rem; }
    .chat-placeholder h3 { color: #374151; font-weight: 700; font-size: 1rem; }
    .chat-placeholder p  { font-size: 0.78rem; }

    iframe#assistant-frame {
      flex: 1; border: none; display: none;
    }

    hr { border: none; border-top: 1px dashed #e5e7eb; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span style="font-size:1.5rem">🤖</span>
    <div>
      <h1>AI 智能行程配置系統</h1>
      <p>最新參數規範測試工具 · v3</p>
    </div>
  </div>
  <div class="header-right">
    var_destination / var_return_departure / var_hotel / user_id ...
  </div>
</header>

<div class="main">

  <!-- ── Left ── -->
  <div class="config-panel">
    <div class="panel-title">✏️ 行程數據配置</div>

    <!-- ENV switch -->
    <div class="env-toggle">
      <button class="env-btn active-uat" id="btn-uat" onclick="setEnv('uat')">🧪 UAT 測試環境</button>
      <button class="env-btn"            id="btn-prod" onclick="setEnv('prod')">🚀 PROD 正式環境</button>
    </div>

    <!-- Base URL (readonly display) -->
    <div class="field">
      <label>助理基礎網址</label>
      <input type="url" id="base-url" class="url-input" readonly
        value="https://altatech.ai/widget/eezuywwgybk5ybgbmbjgeml/chat.html" />
    </div>

    <!-- user_id -->
    <div class="field">
      <label>user_id <span class="opt">選填</span></label>
      <input type="text" id="user-id" placeholder="e.g. U_77889900" value="U_77889900" />
    </div>

    <hr />
    <div class="section-label">行程基本資訊</div>

    <!-- var_destination -->
    <div class="field">
      <label>var_destination <span class="req">必填</span></label>
      <input type="text" id="var-destination" placeholder="目的地（中文）" value="大阪" />
    </div>

    <!-- var_return_departure ← 不同點進出 -->
    <div class="field highlight-field">
      <label>
        var_return_departure <span class="req">必填</span>
        <span class="new-badge">不同點進出</span>
      </label>
      <input type="text" id="var-return-departure"
        placeholder="回程出發地（中文，可與目的地不同）" value="東京" />
      <span class="hint">若去大阪、從東京回，填「東京」</span>
    </div>

    <!-- times -->
    <div class="row-2">
      <div class="field">
        <label>var_arrival_time <span class="req">必填</span></label>
        <input type="datetime-local" id="var-arrival-time" value="2026-10-21T00:00" />
      </div>
      <div class="field">
        <label>var_departure_time <span class="req">必填</span></label>
        <input type="datetime-local" id="var-departure-time" value="2026-10-31T00:00" />
      </div>
    </div>

    <!-- pax -->
    <div class="row-2">
      <div class="field">
        <label>var_adult_num <span class="req">必填</span></label>
        <input type="number" id="var-adult-num" value="2" min="1" />
      </div>
      <div class="field">
        <label>var_child_num <span class="opt">選填</span></label>
        <input type="number" id="var-child-num" value="1" min="0" />
      </div>
    </div>

    <hr />
    <div class="section-label">飯店資訊</div>

    <!-- var_hotel -->
    <div class="json-header">
      <span class="json-label">
        var_hotel <span class="req">必填</span>
      </span>
      <span class="json-badge valid" id="hotel-badge">VALID JSON</span>
    </div>
    <textarea class="json-area" id="var-hotel" rows="7"
      oninput="validateJson(this,'hotel-badge')">[{"i":"2026-10-21","o":"2026-10-24","n":"大阪難波東急STAY","a":"中央區難波3-2-1"},
{"i":"2026-10-24","o":"2026-10-27","n":"京都凱悅飯店","a":"東山區三十三間堂644-2"},
{"i":"2026-10-27","o":"2026-10-29","n":"東京半藏門蒙特利","a":"千代田區一番町23-1"},
{"i":"2026-10-29","o":"2026-10-31","n":"箱根強羅季之湯雪月花","a":"足柄下郡箱根町強羅1300-34"}]</textarea>
    <span class="hint">格式：i=入住 o=退房 n=飯店名 a=地址（縮寫 Key 節省 URL 長度）</span>

    <!-- Launch -->
    <button class="launch-btn" onclick="launchAssistant()">🚀 更新行程並啟動助理</button>
  </div>

  <!-- ── Right ── -->
  <div class="chat-panel">
    <div class="chat-topbar">
      <div class="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">ASSISTANT IDLE</span>
      </div>
      <div class="url-counter">
        網址長度：<span id="url-len">0</span> / <span class="url-warn">2048</span>
      </div>
      <span id="top-hint" style="font-size:0.72rem;color:#9ca3af">等待初始化...</span>
    </div>

    <div class="chat-placeholder" id="chat-placeholder">
      <span class="sparkle">✨</span>
      <h3>更新參數後啟動</h3>
      <p>填妥左側欄位後，按下啟動按鈕</p>
    </div>

    <iframe id="assistant-frame" title="AI 旅遊助理" allow="microphone"></iframe>
  </div>
</div>

<script>
  const URLS = {
    uat:  "https://altatech.ai/widget/eezuywwgybk5ybgbmbjgeml/chat.html",
    prod: "https://altatech.ai/widget/eelblchio6kra5bu4amibg5/chat.html"
  };
  let env = 'uat';

  function setEnv(e) {
    env = e;
    document.getElementById('base-url').value = URLS[e];
    document.getElementById('btn-uat').className  = 'env-btn' + (e==='uat'  ? ' active-uat'  : '');
    document.getElementById('btn-prod').className = 'env-btn' + (e==='prod' ? ' active-prod' : '');
  }

  function validateJson(ta, badgeId) {
    const b = document.getElementById(badgeId);
    try {
      JSON.parse(ta.value);
      b.textContent = 'VALID JSON'; b.className = 'json-badge valid';
    } catch {
      b.textContent = 'INVALID JSON'; b.className = 'json-badge invalid';
    }
  }

  function launchAssistant() {
    const hotelRaw = document.getElementById('var-hotel').value.trim();
    let hotelParsed;
    try { hotelParsed = JSON.parse(hotelRaw); }
    catch { alert('var_hotel JSON 格式錯誤，請修正後再試'); return; }

    const params = new URLSearchParams({
      user_id:              document.getElementById('user-id').value,
      var_destination:      document.getElementById('var-destination').value,
      var_return_departure: document.getElementById('var-return-departure').value,
      var_arrival_time:     document.getElementById('var-arrival-time').value.replace('T',' '),
      var_departure_time:   document.getElementById('var-departure-time').value.replace('T',' '),
      var_adult_num:        document.getElementById('var-adult-num').value,
      var_child_num:        document.getElementById('var-child-num').value,
      var_hotel:            JSON.stringify(hotelParsed),
    });

    const finalUrl = `${URLS[env]}?${params.toString()}`;
    const len = finalUrl.length;
    document.getElementById('url-len').textContent = len;
    document.getElementById('url-len').style.color = len > 2048 ? '#ef4444' : '#111';
    if (len > 2048) {
      alert(`⚠️ URL 長度 ${len} 已超過 2048 字元限制！請縮短飯店資料。`);
      return;
    }

    const frame = document.getElementById('assistant-frame');
    frame.src = finalUrl;
    frame.style.display = 'block';
    document.getElementById('chat-placeholder').style.display = 'none';

    const dot = document.getElementById('status-dot');
    dot.className = 'dot live';
    document.getElementById('status-text').textContent = env === 'prod' ? 'PROD · LOADING' : 'UAT · LOADING';
    document.getElementById('top-hint').textContent = '正在載入行程助理...';
    frame.onload = () => {
      document.getElementById('status-text').textContent = env === 'prod' ? 'PROD · READY' : 'UAT · READY';
      document.getElementById('top-hint').textContent = '助理已就緒';
    };
  }
</script>
</body>
</html>
